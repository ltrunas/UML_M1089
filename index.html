<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UML per a jocs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with section buttons; one section visible at a time; white "paper" cards hold the diagrams */
:root{--bg:#f5f7f7;--fg:#17262b;--mut:#5a6b70;--card:#ffffff;--line:#d5dede;--teal:#0f766e;--teal-s:#d9f0ec;--pur:#6d4bc4;--pur-s:#ebe5fa;--warn:#b45309;--warn-s:#fdf0dc;
--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191b;--fg:#e6eeee;--mut:#97a8ab;--card:#182427;--line:#2b3b3f;--teal:#4fd1c0;--teal-s:#16393a;--pur:#b79cff;--pur-s:#2a2342;--warn:#f0b35a;--warn-s:#3a2c14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10191b;--fg:#e6eeee;--mut:#97a8ab;--card:#182427;--line:#2b3b3f;--teal:#4fd1c0;--teal-s:#16393a;--pur:#b79cff;--pur-s:#2a2342;--warn:#f0b35a;--warn-s:#3a2c14;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
header{padding:24px 0 12px}
.brand{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-bottom:14px}
.brand img{display:block;height:56px;width:auto}
header small{font:600 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{font:700 clamp(28px,5vw,44px)/1.1 var(--fd);margin:6px 0 8px;text-wrap:balance}
header p{margin:0;color:var(--mut);max-width:62ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;margin-bottom:24px}
nav button{flex:none;font:500 14px var(--fb);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
nav button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-current="true"]{color:#0b1b1a}}
:root[data-theme="dark"] nav button[aria-current="true"]{color:#0b1b1a}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
section{display:none}section.on{display:block}
h2{font:700 clamp(22px,3.4vw,30px)/1.2 var(--fd);margin:0 0 6px}
h3{font:700 19px/1.3 var(--fd);margin:28px 0 8px}
p,li{max-width:70ch}
.lead{color:var(--mut);font-size:17px;max-width:64ch}
a{color:var(--teal)}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:12px 0}
.paper img{display:block;margin:0 auto;max-width:100%;height:auto}
.cap{font-size:13px;color:var(--mut);margin:0 0 14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.seg button{font:500 14px var(--fb);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pur-s);border-color:var(--pur);color:var(--pur);font-weight:600}
ol.steps{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 52px;position:relative;max-width:none}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--teal-s);color:var(--teal);font:700 14px/26px var(--fd);text-align:center}
.tips{display:grid;gap:8px;padding:0;list-style:none}
.tips li{background:var(--teal-s);border-radius:8px;padding:10px 14px;max-width:none}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:6px 0;max-width:none}
summary{cursor:pointer;padding:10px 14px;font-weight:500}
details>div{padding:0 14px 12px;color:var(--mut)}
.qs{display:grid;gap:0}
.qs details[open]{border-color:var(--pur)}
.qs summary::marker{color:var(--pur)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h4{margin:0 0 4px;font:700 17px var(--fd)}
.card p{margin:0 0 10px;color:var(--mut);font-size:15px}
.card button,.go{font:500 14px var(--fb);background:var(--teal-s);color:var(--teal);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.tblw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card);font-weight:600}
.note{background:var(--warn-s);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:15px;max-width:none}
.chk{list-style:none;padding:0;display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;max-width:none}
.chk input{margin-top:5px;accent-color:var(--teal)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.sel{display:grid;gap:8px;margin:12px 0}
.sel button{text-align:left;font:500 15px var(--fb);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
.sel button:hover{border-color:var(--teal)}
#ans{background:var(--pur-s);border-radius:10px;padding:12px 16px;margin-top:8px;min-height:20px}
#ans:empty{display:none}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand"><img src="images/emav_logo.png" alt="EMAV, Escola de Mitjans Audiovisuals"></div><br>
<small>Mòdul 1089 · Projectes de jocs i entorns interactius</small>
<h1>UML per dissenyar jocs i experiències interactives</h1>
<p>Apunts, guies pas a pas, preguntes per pensar i una mini guia per fer el teu propi UML. Tria una secció dalt.</p>
</header>
<nav id="nav" aria-label="Seccions"></nav>
<main id="main"></main>
<footer>Apunts de Laura Trunas · EMAV</footer>
</div>

<script>
var IMG=function(n,alt){return '<div class="paper"><img src="images/'+n+'.png" alt="'+alt+'"></div>'};
var L=function(h,t){return '<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>'};
function steps(a){return '<ol class="steps">'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'}
function tips(a){return '<ul class="tips">'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
function qs(a){return '<div class="qs">'+a.map(function(x){return '<details><summary>'+x[0]+'</summary><div>'+x[1]+'</div></details>'}).join('')+'</div>'}
function links(a){return '<ul>'+a.map(function(x){return '<li>'+L(x[0],x[1])+(x[2]?': '+x[2]:'')+'</li>'}).join('')+'</ul>'}
function table(h,rows){return '<div class="tblw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function typed(prefix,caps,alts,extra){ // project-type switcher
  var id='t'+prefix;
  return '<div class="seg" data-grp="'+prefix+'"><button aria-pressed="true" data-k="classic">Videojoc clàssic</button><button aria-pressed="false" data-k="vr">Videojoc VR</button><button aria-pressed="false" data-k="museu">Experiència de museu</button>'+(extra?'<button aria-pressed="false" data-k="'+extra.k+'">'+extra.label+'</button>':'')+'</div>'+
  ['classic','vr','museu'].map(function(k,i){return '<div class="ex" data-grp="'+prefix+'" data-k="'+k+'"'+(i?' hidden':'')+'>'+IMG(prefix+'_'+k,alts[i])+'<p class="cap">'+caps[i]+'</p></div>'}).join('')+(extra?'<div class="ex" data-grp="'+prefix+'" data-k="'+extra.k+'" hidden>'+IMG(prefix+'_'+extra.k,extra.alt)+'<p class="cap">'+extra.cap+'</p></div>':'');
}

var S={};
S.inici={t:'Inici',h:function(){return '<h2>Què és UML i per a què serveix</h2>'+
'<p class="lead">UML (<em>Unified Modeling Language</em>) és un llenguatge visual estàndard per descriure com està pensat un sistema abans de construir-lo. No és un llenguatge de programació i no s\'executa. És universal: les formes són les mateixes a tot el món.</p>'+
'<h3>Quin diagrama necessito?</h3><p>Tria la pregunta que et fas ara mateix:</p><div class="sel" id="sel">'+
'<button data-a="casos|Qui fa què amb el meu projecte? Fes un diagrama de casos d\'ús.">Vull saber qui fa què amb el meu projecte</button>'+
'<button data-a="activitat|Quins passos segueix una acció, amb decisions i camins que fallen? Fes un diagrama d\'activitat.">Vull dibuixar els passos d\'una acció</button>'+
'<button data-a="estats|En quins modes pot estar un element i què el fa canviar? Fes un diagrama d\'estats.">Vull saber en quins modes pot estar alguna cosa</button>'+
'<button data-a="classes|Quines peces té el sistema i com es relacionen? Fes un diagrama de classes.">Vull ordenar les peces del joc abans de programar</button>'+
'</div><div id="ans"></div>'+
'<h3>Per a què serveix en un projecte de jocs</h3><ul><li><strong>Alinear l\'equip:</strong> tothom entén el mateix joc abans de tocar el motor.</li><li><strong>Trobar errors a temps:</strong> canviar un diagrama costa minuts; canviar un nivell ja construït costa dies.</li><li><strong>Documentar la preproducció:</strong> el diagrama és un lliurable avaluable, independent de l\'eina.</li><li><strong>Treballar amb qualsevol motor:</strong> UML és el pla; Unity, Unreal o Scratch són la construcció.</li></ul>'+
'<h3>Els quatre diagrames d\'aquest tema</h3>'+IMG('overview','Esquema de la relació entre els diagrames UML del tema')+
table(['Diagrama','Pregunta que respon','Grup'],[['Casos d\'ús','Qui fa què amb el sistema?','Comportament'],['Activitat','Quins passos segueix aquesta acció?','Comportament'],['Estats','En quins modes pot estar aquest element?','Comportament'],['Classes','Quines peces té el sistema i com es relacionen?','Estructural']])+
'<h3>Ordre de treball recomanat</h3>'+steps(['<strong>Casos d\'ús:</strong> decideix què pot fer cada actor (jugador, visitant, sensor).','<strong>Activitat:</strong> per als casos d\'ús importants, dibuixa els passos i les decisions.','<strong>Estats:</strong> per als elements que canvien de mode (partida, enemic, instal·lació), dibuixa estats i transicions.','<strong>Classes (opcional):</strong> si programes, ordena les peces del sistema.','<strong>Implementació:</strong> construeix-ho al motor amb el que has dissenyat.'])+
'<p class="note"><strong>UML és el pla; el motor és la construcció.</strong> El diagrama no depèn de l\'eina, però cada motor té un lloc natural on es tradueix:</p>'+
table(['Diagrama','Unity','Unreal','Scratch'],[['Casos d\'ús','Es fa a part (disseny)','Es fa a part (disseny)','Es fa a part (disseny)'],['Activitat','Codi C# o lògica d\'<code>Update()</code>',L('https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-blueprints-visual-scripting-in-unreal-engine','Blueprints')+': nodes amb fils d\'execució','Piles de blocs'],['Estats',L('https://docs.unity3d.com/Manual/AnimationStateMachines.html','Animator Controller'),L('https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Plugins/StateTreeModule','State Tree')+' o Behavior Tree per a la IA','Una variable «estat» amb «si ... llavors»'],['Classes','Scripts C# i components','Classes C++ o Blueprints, amb herència','No té classes: sprites amb els seus blocs']])}}
S.casos={t:'Casos d\'ús',h:function(){return '<h2>Diagrama de casos d\'ús</h2><p class="lead">Mostra <strong>qui fa què amb el sistema, vist des de fora</strong>. És el millor punt de partida: no cal saber res de programació i obliga a decidir l\'abast del projecte.</p>'+
'<h3>Formes</h3>'+IMG('leg_uc','Formes del diagrama de casos d\'ús')+
'<h3>Guia pas a pas</h3>'+steps(['<strong>Defineix el sistema:</strong> què modeles (tot el joc, una experiència) i dibuixa el rectangle que el delimita.','<strong>Identifica els actors:</strong> persones o sistemes externs (jugador, un altre jugador, sensor, operador). Van fora del rectangle.','<strong>Escriu els objectius de cada actor:</strong> pregunta «què vol aconseguir?». Cada objectiu és un cas d\'ús, amb verb + complement (<em>Recollir objecte</em>).','<strong>Dibuixa els casos d\'ús</strong> com a el·lipses dins del rectangle.','<strong>Connecta cada actor</strong> amb els casos d\'ús on participa.','<strong>Afegeix relacions només si cal:</strong> <code>«include»</code> quan una acció sempre en requereix una altra; <code>«extend»</code> quan és opcional o depèn d\'una condició.','<strong>Revisa:</strong> hi ha algun actor sense casos? Algun cas sense actor?'])+
'<h3>Consells</h3>'+tips(['Un cas d\'ús és un <strong>objectiu de l\'actor</strong>, no un pas intern: «Atacar» sí, «Calcular dany» no (això va a l\'activitat).','El diagrama diu <strong>qui participa, no com ho fa</strong>. Si un actor es mou diferent d\'un altre però l\'objectiu és el mateix, es connecta al mateix «Moure\'s»; la diferència s\'explica a l\'activitat.','<strong>Els nivells no són casos d\'ús:</strong> «Nivell 1» és contingut. Si les mecàniques canvien a cada nivell, fes un diagrama general (accions comunes) i un per nivell (només el que és nou). Si un nivell només afegeix una acció, usa <code>«extend»</code>.','<strong>Menús:</strong> només les opcions que siguin funcionalitats (Iniciar partida, Configurar opcions). Configuració és un sol cas d\'ús; la navegació entre pantalles va al diagrama d\'estats.','Apunta a <strong>5–8 casos d\'ús</strong>; si en tens més de 10, agrupa o divideix.','Els actors secundaris (sensor, operador, un servei extern) es dibuixen normalment a la dreta del rectangle. <strong>Els enemics amb IA no són actors:</strong> són part del sistema i el seu comportament va als diagrames d\'estats i d\'activitat.'])+
'<h3>Preguntes per a l\'alumnat</h3>'+qs([['Qui interactua amb el meu projecte, a més del jugador o visitant?','Pensa en altres jugadors, sensors, operadors, servidors o altres jugadors.'],['Què vol aconseguir cada actor? Quin verb ho descriu?','Si no pots posar un verb, probablement no és un cas d\'ús sinó un pas intern.'],['Si trec aquesta acció, el projecte continua tenint sentit?','Si sí, potser és opcional (<code>«extend»</code>) o no cal al diagrama.'],['Aquesta acció passa a tot el joc o només en un nivell?','Tot el joc: diagrama general. Només un nivell: diagrama del nivell o <code>«extend»</code>.'],['Hi ha alguna acció que només fa un actor secundari?','Ho pots deixar al diagrama si és rellevant per al sistema.'],['Ho entendria algú que no hagi vist mai el joc?','Aquesta és la prova final.']])+
'<h3>Els esquemes d\'exemple</h3>'+typed('uc',['Els enemics controlats per la IA són part del sistema: no apareixen com a actor, només el jugador.','Només hi ha un actor, el jugador: el casc i els comandaments són el mitjà, no un actor. En lila, les accions exclusives de la VR.','No hi ha «jugador»: hi ha visitant, sensor i operador, i apareix «Reiniciar sistema» com a tasca de l\'operador.'],['Casos d\'ús d\'un videojoc clàssic','Casos d\'ús d\'un videojoc VR','Casos d\'ús d\'una experiència de museu'],{k:'online',label:'Joc en línia',alt:'Casos d\'ús d\'un joc en línia',cap:'Aquí sí hi ha actors externs: una altra persona (multijugador) i un servei de rànquing que no és part del joc. L\'enemic amb IA continua dins del sistema.'})+
'<h3>Per saber-ne més</h3>'+links([['https://lucid.co/es/diagrama/uml/tutorial-diagrama-de-casos-de-uso','Tutorial de diagrames de casos d\'ús (Lucidchart, en castellà)','elements del diagrama i passos per crear-lo.'],['https://www.cs.upc.edu/prop/data/uploads/ies/3.-casos-dus.pdf','Casos d\'Ús a l\'UML (PDF en català, allotjat a cs.upc.edu)','actors, escenari principal, alternatius i excepcionals.'],['https://www.youtube.com/watch?v=fJa3cshrFWs','Vídeo: Tutorial sobre Casos de Uso y UML desde cero, con include, extend y ejemplos (YouTube)','castellà.']])}}
S.activitat={t:'Activitat',h:function(){return '<h2>Diagrama d\'activitat</h2><p class="lead">Descriu <strong>els passos d\'una acció</strong>, amb decisions i accions que passen alhora. Es pot veure com un diagrama de flux amb símbols estàndard; cada cas d\'ús important es pot desplegar en un.</p>'+
'<h3>Formes</h3>'+IMG('leg_act','Formes del diagrama d\'activitat')+
'<h3>Guia pas a pas</h3>'+steps(['<strong>Tria una sola acció</strong> (un cas d\'ús) per diagrama.','<strong>Dibuixa l\'inici</strong> (cercle ple) i el primer pas.','<strong>Escriu cada pas com una acció</strong> en un rectangle arrodonit: una acció per caixa.','<strong>Quan hi ha una pregunta, posa un rombe</strong> amb les sortides etiquetades (sí / no).','<strong>Si dues coses passen alhora,</strong> separa-les amb una barra gruixuda (<em>fork</em>) i uneix-les amb una altra (<em>join</em>).','<strong>Acaba cada camí amb un final</strong> (cercle amb anell). Pot haver-n\'hi més d\'un.','<strong>Revisa:</strong> cada rombe té totes les sortides etiquetades? Cada camí arriba a un final?'])+
'<h3>Consells</h3>'+tips(['Es llegeix <strong>de dalt a baix</strong>; evita fletxes que pugen, tret que sigui un bucle.','<strong>Una acció per caixa:</strong> si el text porta una «i», probablement són dues accions.','Les decisions són preguntes que es contesten amb una resposta clara: «Inventari ple?».','Dibuixa també <strong>els camins que fallen:</strong> sense munició, sense sensor, sense espai.','No barregis activitat i estats: l\'activitat descriu <strong>passos</strong>, l\'estat descriu <strong>modes</strong>.','Si passa de 10–12 elements, divideix-lo en dos diagrames.','Els <strong>carrils</strong> (<em>swimlanes</em>) permeten mostrar qui fa cada pas (jugador, sistema, sensor).','En VR i en experiències físiques, la resposta (vibració, llum, so) és una acció més del flux.','<strong>Errors tècnics:</strong> afegeix una decisió «Hi ha error?» amb una sortida que avisa i torna a un pas segur; no deixis cap camí penjat.'])+
'<h3>Preguntes per a l\'alumnat</h3>'+qs([['Quin és el primer pas i què l\'activa?','Ha de coincidir amb l\'objectiu d\'un cas d\'ús.'],['Hi ha alguna decisió? Quines respostes té?','Cada resposta és una sortida etiquetada del rombe.'],['Què passa si alguna cosa falla?','Dibuixa-ho: és la part que sol faltar.'],['Hi ha accions que passin al mateix temps?','Usa fork i join.'],['On acaba cada camí?','Cada camí ha d\'arribar a un final (o tornar al repòs en una experiència interactiva).'],['Algú altre podria seguir el diagrama sense que jo l\'expliqui?','Prova-ho amb una companya o un company.']])+
'<h3>Els tres esquemes d\'exemple</h3>'+typed('ac',['Dues decisions seguides; els camins que fallen acaben aviat.','El ressaltat visual abans d\'agafar i la vibració del comandament formen part del flux.','La barra gruixuda mostra que llums i so passen alhora; si el visitant no interactua, es torna al repòs. Una decisió final mostra què passa si hi ha un error: s\'avisa l\'operador.'],['Activitat de recollir objecte en un videojoc clàssic','Activitat d\'agafar un objecte en VR','Activitat de l\'arribada d\'un visitant al museu'])+
'<h3>Per saber-ne més</h3>'+links([['https://lucid.co/es/diagrama/uml/tutorial-diagrama-de-actividad','Tutorial de diagrama d\'activitat (Lucidchart, en castellà)','símbols (inici, acció, decisió, bifurcació/unió, final) i passos per crear-lo.'],['https://www.youtube.com/watch?v=GoYdpOVhDRc','Vídeo: Diagrama de Actividades, tutorial UML en español (YouTube)','castellà.'],['https://www.youtube.com/watch?v=C0kbaWGIcNY','Vídeo: Curso UML, diagrama de actividades III, swimlane e interruptible activity (YouTube)','carrils; en castellà.']])}}
S.estats={t:'Estats',h:function(){return '<h2>Diagrama d\'estats</h2><p class="lead">Mostra <strong>els modes en què pot estar un element i què fa que canviï de mode</strong>. Serveix per a la partida, un enemic, una porta o una instal·lació sencera. A diferència de l\'activitat, no té un recorregut de principi a fi: l\'element sempre és en un estat i només canvia quan passa alguna cosa.</p>'+
'<h3>Formes</h3>'+IMG('leg_st','Formes del diagrama d\'estats')+
'<h3>Guia pas a pas</h3>'+steps(['<strong>Tria un sol element:</strong> la partida, l\'enemic, la instal·lació.','<strong>Llista els estats:</strong> els modes en què es comporta diferent. Es nomenen amb un adjectiu o un gerundi (<em>Patrullant</em>, <em>Pausa</em>).','<strong>Marca l\'estat inicial</strong> amb el cercle ple.','<strong>Per a cada estat pregunta «què hi pot passar?»</strong> i dibuixa les transicions: una fletxa amb l\'esdeveniment que provoca el canvi.','<strong>Afegeix condicions</strong> entre claudàtors (<code>[vida = 0]</code>) només quan facin falta.','<strong>Agrupa en un estat compost</strong> quan diversos estats comparteixen sortides: així <em>Pausa</em> i <em>Game over</em> es dibuixen una sola vegada, en lloc d\'una per nivell.','<strong>Afegeix un estat final</strong> només si l\'element deixa d\'existir o l\'experiència acaba.','<strong>Revisa:</strong> hi ha estats sense sortida? Transicions sense etiqueta? Es pot arribar a tots els estats?'])+
'<h3>Consells</h3>'+tips(['Un estat és un <strong>mode amb comportament diferent</strong>. Si només canvia un número o un mapa, és una dada, no un estat. <strong>La prova:</strong> «si canvio això, també canvien les fletxes?». Si sí, és un estat.','<strong>Cada fletxa porta una etiqueta.</strong> Una fletxa sense esdeveniment és l\'error més habitual.','<strong>Menú:</strong> <em>Menú</em>, <em>Configuració</em> i <em>Crèdits</em> són estats. La navegació entre pantalles va aquí; les funcionalitats van als casos d\'ús.','<strong>Nivells:</strong> si tenen mecàniques diferents, són subestats dins de <em>Jugant</em>. Si només canvien el mapa o la dificultat, no apareixen.','<strong>Experiències interactives:</strong> inclou sempre un estat de <em>repòs</em> i un temps d\'inactivitat que ho reinicia tot. Normalment no tenen final.','<strong>VR:</strong> pensa en la calibració inicial i en l\'avís quan l\'usuari surt de la zona segura.','<strong>Errors del sistema:</strong> afegeix un estat (<em>Sense connexió</em>, <em>Sensor no disponible</em>) amb la transició d\'entrada («connexió perduda») i la de sortida («reconnecta», «temps esgotat»). Així el diagrama diu què passa quan alguna cosa falla.','Al motor es tradueix en un <em>Animator Controller</em> (Unity), un <em>State Tree</em> (Unreal) o una variable d\'estat amb «si ... llavors» (Scratch).'])+
'<h3>Preguntes per a l\'alumnat</h3>'+qs([['Quins modes diferents té aquest element?','Si el comportament és el mateix, és un sol estat.'],['Quin és l\'estat inicial?','Sol ser el menú, el repòs o la calibració.'],['Què fa que canviï d\'estat: una acció del jugador, un temps, una condició?','Aquest és el text de la fletxa.'],['Es pot tornar enrere? Per on?','Dibuixa els camins de tornada: pausa → jugant, repòs ← inactivitat.'],['Hi ha algun estat del qual no es pugui sortir?','Només és vàlid si és un final.'],['Què passa si el visitant se\'n va a mig camí, o si el jugador es treu el casc?','Aquests casos són estats o transicions que se solen oblidar.'],['Què passa si falla la connexió, el sensor o un recurs? Quin estat ho recull i com se\'n surt?','Afegeix un estat d\'error amb entrada i sortida.'],['Allò que vull afegir és un estat o només una dada?','Fes la prova de les fletxes.']])+
'<h3>Els tres esquemes d\'exemple</h3>'+typed('st',['<em>Jugant</em> és un estat compost amb els nivells a dins; <em>Pausa</em> i <em>Game over</em> es connecten una sola vegada.','Apareixen la calibració i l\'avís de límit, dos estats que no existeixen en un joc de pantalla.','Cicle sense final que torna al repòs, per finalització o per inactivitat. Si el sensor falla, passa a un estat d\'error i torna al repòs quan es recupera.'],['Estats d\'un videojoc clàssic','Estats d\'un videojoc VR','Estats d\'una experiència de museu'],{k:'online',label:'Joc en línia',alt:'Estats d\'un joc en línia',cap:'Hi ha un estat de <em>Sense connexió</em>: s\'hi entra quan es perd la connexió i se\'n surt reconnectant o passat el temps màxim.'})+
'<h3>Per saber-ne més</h3>'+links([['https://miro.com/diagramming/what-is-a-uml-state-machine-diagram/','State Machine Diagrams in UML: A Complete Guide (Miro, en anglès)','estats, transicions, esdeveniments i condicions de guarda.'],['https://mermaid.js.org/syntax/stateDiagram','Mermaid: State diagrams','sintaxi de text per dibuixar estats, transicions i estats compostos.'],['https://docs.unity3d.com/Manual/AnimationStateMachines.html','Unity: Animation State Machines','com es fan servir les màquines d\'estats a Unity.'],['https://www.youtube.com/watch?v=Rk3cPADj__M','Vídeo: Diagrama de Máquina de Estados I, tutorial UML en español (YouTube)','castellà.'],['https://www.youtube.com/watch?v=4tLQ9CoR10g','Vídeo: UML state machine diagram tutorial, how to build your own with Lucidchart (YouTube)','anglès.']])}}
S.classes={t:'Classes',h:function(){return '<h2>Per tancar el tema: diagrama de classes</h2><p class="lead">Aquest diagrama és <strong>opcional</strong> per a l\'alumnat que no programa, però tanca el cicle per als qui sí: ordena les peces del sistema abans de programar-les.</p>'+
'<h3>Diagrama de classes</h3><p>Mostra les <strong>peces del sistema</strong> (personatges, objectes, sistemes), què guarda cada una i com es relacionen. A Unreal es correspon amb les classes C++ o els Blueprints; a Unity, amb scripts i components; a Scratch no té equivalent directe.</p>'+IMG('ex_class','Exemple de diagrama de classes d\'un joc')+
table(['Símbol','Significat','Exemple'],[['Caixa de tres parts','Classe: nom, atributs (dades) i mètodes (accions)','<em>Personatge</em> amb <code>vida</code> i <code>moure()</code>'],['Línia amb triangle buit','Herència: «és un»','<em>Enemic</em> és un <em>Personatge</em>'],['Línia amb rombe buit','Agregació: «té un», però existeix per si sol','<em>Jugador</em> porta una <em>Arma</em>'],['Línia amb rombe ple','Composició: «és part de», no existeix sense el tot','Una <em>Ferida</em> d\'un <em>Personatge</em>'],['Números (<code>1</code>, <code>0..1</code>, <code>1..*</code>)','Multiplicitat: quants n\'hi ha','Un <em>Jugador</em> porta 0 o 1 <em>Arma</em>']])+
tips(['Comença només amb els noms de classe i afegeix atributs i mètodes quan sàpigues quins necessites.','Posa les dades comunes a la classe pare (<em>Personatge</em>) i les específiques a les filles.','No cal que cada mètode de codi hi aparegui: només els que expliquen el comportament.'])+
'<h3>Preguntes per a l\'alumnat</h3>'+qs([['Quines coses del meu projecte tenen dades i accions pròpies?','Cada una és una candidata a classe.'],['Quines comparteixen dades o accions? Poden heretar d\'una classe comuna?','Si dues coses repeteixen atributs, probablement tenen un pare comú.'],['Una cosa «té» una altra o «és» una altra?','«Té» és agregació o composició; «és» és herència.'],['Si elimino aquesta peça, què més desapareix?','Si desapareix tot, és composició.']])+
'<h3>Per saber-ne més</h3>'+links([['https://s.visual-paradigm.com/guide/visualizing-software-the-ultimate-guide-to-uml-concepts-and-diagrams/','Guia d\'UML de Visual Paradigm (en anglès)','classes, activitat i estats amb exemples.'],['https://plantuml.com/class-diagram','PlantUML: diagrama de classes','']])}}

'<h3>Consells d\'ús a l\'aula</h3>'+tips(['<strong>Esbossa primer a paper o pissarra.</strong> Passar a l\'eina després és més ràpid i el diagrama ja està pensat.','<strong>Una sola eina per a tota la classe</strong> facilita l\'ajuda i la correcció; deixa PlantUML i Mermaid com a opció per a qui vulgui anar més lluny.','<strong>Que el lliurament sigui exportable:</strong> demana PNG o PDF i, si és possible, també el fitxer font perquè es pugui editar.','<strong>No cal que sigui bonic.</strong> Valora que les formes siguin les correctes i que cada fletxa tingui etiqueta.','<strong>Treball en grup:</strong> un únic fitxer compartit (draw.io a Drive, Miro) evita versions duplicades.'])+

table(['Error','Diagrama','Com es corregeix'],[['Fletxes sense etiqueta','Estats i activitat','Escriu l\'esdeveniment (estats) o sí/no (decisions) a cada fletxa'],['Casos d\'ús que són passos interns («Calcular dany»)','Casos d\'ús','Passa\'ls a l\'activitat; el cas d\'ús és un objectiu de l\'actor'],['Nivells posats com a casos d\'ús','Casos d\'ús','Són contingut: un diagrama general i un per nivell, o <code>«extend»</code>'],['Actors dins del rectangle, o casos d\'ús fora','Casos d\'ús','Actors fora, casos d\'ús dins'],['Dues accions en una sola caixa','Activitat','Divideix-la en dues'],['Rombe amb una sola sortida','Activitat','Una decisió té com a mínim dues sortides etiquetades'],['Camí que no arriba a cap final','Activitat','Acaba\'l amb un final o torna\'l a un pas anterior'],['Estat que en realitat és una acció («Disparar»)','Estats','Un estat és un mode: «Atacant», no «Atacar»'],['Dada convertida en estat (dificultat, mapa)','Estats','Si no canvien les fletxes, és una dada'],['Estat sense sortida','Estats','Afegeix la transició o marca\'l com a final'],['Oblidar el repòs i la inactivitat','Estats (experiències interactives)','Afegeix un estat de repòs i un temps que ho reinicia'],['Només el camí feliç','Tots','Pregunta «què passa si falla?» i dibuixa-ho'],['Barrejar passos i modes al mateix diagrama','Activitat i estats','Fes-ne dos: un per als passos, un per als modes']])+

S.mini={t:'Mini guia',h:function(){return '<h2>Mini guia per a l\'alumnat</h2><p class="lead">Tres diagrames, quatre passos i cinc regles per dissenyar el teu projecte abans de fer-lo.</p>'+
'<h3>1. Quin diagrama necessito?</h3>'+table(['Pregunta','Diagrama'],[['Qui fa què amb el meu projecte?','Casos d\'ús'],['Quins passos segueix aquesta acció?','Activitat'],['En quins modes pot estar aquest element?','Estats']])+'<p>Si programes, també et pot servir el de <strong>classes</strong> (quines peces tinc?).</p>'+
'<h3>2. Formes bàsiques</h3>'+IMG('leg_uc','Formes dels casos d\'ús')+IMG('leg_act','Formes de l\'activitat')+IMG('leg_st','Formes dels estats')+
'<h3>3. Com fer-ho en 4 passos</h3>'+steps(['<strong>Una frase:</strong> escriu què és el teu projecte i qui hi interactua (actors).','<strong>Casos d\'ús:</strong> un rectangle per al sistema, els actors fora i els objectius (verb + complement) dins.','<strong>Activitat:</strong> tria el cas d\'ús més important i dibuixa els seus passos, les decisions i els finals.','<strong>Estats:</strong> tria l\'element que canvia de mode (la partida, l\'enemic, la instal·lació) i dibuixa els estats i les transicions.'])+
'<h3>4. Cinc regles d\'or</h3>'+tips(['<strong>Cada fletxa porta etiqueta</strong> (un esdeveniment o un sí/no).','<strong>Una acció per caixa.</strong>','<strong>Un cas d\'ús és un objectiu</strong>, no un pas intern.','<strong>Un estat és un mode</strong>, no una acció.','<strong>Dibuixa també què passa quan alguna cosa falla.</strong>'])+
'<h3>5. Segons el teu projecte</h3>'+table(['Si el teu projecte és...','Afegeix...'],[['Videojoc clàssic','Cap actor per als enemics amb IA (són part del sistema); els nivells com a subestats de <em>Jugant</em> si canvien les mecàniques; <em>Pausa</em> i <em>Game over</em>'],['Videojoc VR','Un sol actor, el jugador (el casc i els comandaments són el mitjà); un estat de calibració i un avís de límit; la vibració o el ressaltat com a accions'],['Experiència de museu','Visitant, sensor i operador com a actors; un estat de <em>Repòs</em> i un temps d\'inactivitat que ho reinicia; normalment, sense final']])+
'<h3>6. Abans de lliurar</h3><div class="prog"><i id="pbar2"></i></div><ul class="chk" id="chk2"></ul>'+
'<h3>7. Eines i on mirar</h3><ul><li>Primer, <strong>a paper</strong>. Després, '+L('https://www.drawio.com/blog/uml-diagram-tools','draw.io')+' per passar-ho a net.</li><li>Si t\'agrada escriure text: '+L('https://plantuml.com/sitemap','PlantUML')+' o '+L('https://mermaid.js.org/syntax/stateDiagram','Mermaid')+'.</li><li>Tutorials: '+L('https://lucid.co/es/diagrama/uml/tutorial-diagrama-de-casos-de-uso','casos d\'ús')+', '+L('https://lucid.co/es/diagrama/uml/tutorial-diagrama-de-actividad','activitat')+' i '+L('https://miro.com/diagramming/what-is-a-uml-state-machine-diagram/','estats')+'.</li></ul>'}}

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'{}');localStorage.setItem(k,JSON.stringify(v))}catch(e){return {}}}
function checklist(id,items,bar,key){var ul=document.getElementById(id);if(!ul)return;var st=store(key);
  ul.innerHTML=items.map(function(t,i){return '<li><label><input type="checkbox" id="'+id+'-'+i+'"'+(st[i]?' checked':'')+'><span>'+t+'</span></label></li>'}).join('');
  function upd(){var n=0;items.forEach(function(_,i){if(document.getElementById(id+'-'+i).checked)n++});document.getElementById(bar).style.width=(100*n/items.length)+'%'}
  ul.addEventListener('change',function(){var s={};items.forEach(function(_,i){s[i]=document.getElementById(id+'-'+i).checked});store(key,s);upd()});upd()}
var nav=document.getElementById('nav'),main=document.getElementById('main');
ORDER.forEach(function(k){var b=document.createElement('button');b.textContent=S[k].t;b.dataset.k=k;b.onclick=function(){go(k,true)};nav.appendChild(b);
  var s=document.createElement('section');s.id='s-'+k;s.innerHTML=S[k].h();main.appendChild(s)});
function go(k,push){ORDER.forEach(function(x){document.getElementById('s-'+x).classList.toggle('on',x===k)});
  Array.prototype.forEach.call(nav.children,function(b){b.setAttribute('aria-current',b.dataset.k===k?'true':'false')});
  var cur=Array.prototype.find.call(nav.children,function(b){return b.dataset.k===k});if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
  if(push)location.hash=HASH[k];window.scrollTo(0,0)}
function fromHash(){var h=location.hash.replace('#','');var k=ORDER.filter(function(x){return HASH[x]===h})[0]||'inici';go(k,false)}
window.addEventListener('hashchange',fromHash);
document.addEventListener('click',function(e){
  var sb=e.target.closest('.seg button');
  if(sb){var g=sb.parentNode.dataset.grp,k=sb.dataset.k;Array.prototype.forEach.call(sb.parentNode.children,function(b){b.setAttribute('aria-pressed',b===sb?'true':'false')});
    Array.prototype.forEach.call(document.querySelectorAll('.ex[data-grp="'+g+'"]'),function(d){d.hidden=d.dataset.k!==k})}
  var sl=e.target.closest('#sel button');
  if(sl){var p=sl.dataset.a.split('|');document.getElementById('ans').innerHTML='<p style="margin:0 0 8px">'+p[1]+'</p><button class="go" data-go="'+p[0]+'">Anar a la secció</button>'}
  var gb=e.target.closest('[data-go]');if(gb)go(gb.dataset.go,true)});
